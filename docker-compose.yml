services:
  api:
    image: fjmedina21/erp-base-api:latest
    container_name: erp-base-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: ${ASPNETCORE_URLS}
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection}
      Cloudinary__CloudName: ${CLOUDINARY_CLOUD_NAME}
      Cloudinary__ApiKey: ${CLOUDINARY_API_KEY}
      Cloudinary__ApiSecret: ${CLOUDINARY_API_SECRET}
      Cloudinary__Folder: ${CLOUDINARY_FOLDER}
      Seed__AdminEmail: ${SEED_ADMIN_EMAIL}
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD}
      Email__Smtp__Host: ${EMAIL_SMTP_HOST}
      Email__Smtp__Port: ${EMAIL_SMTP_PORT}
      Email__Smtp__EnableSsl: ${EMAIL_SMTP_ENABLE_SSL}
      Email__Smtp__UserName: ${EMAIL_SMTP_USERNAME}
      Email__Smtp__Password: ${EMAIL_SMTP_PASSWORD}
      Email__Smtp__FromEmail: ${EMAIL_SMTP_FROM_EMAIL}
      Email__Smtp__FromName: ${EMAIL_SMTP_FROM_NAME}
    ports:
      - "${API_PORT}:8080"

  web:
    image: fjmedina21/erp-base-web:latest
    container_name: erp-base-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      VITE_API_URL: ${WEB_API_URL:-http://localhost:5080/api}
    ports:
      - "${WEB_PORT:-8080}:80"
