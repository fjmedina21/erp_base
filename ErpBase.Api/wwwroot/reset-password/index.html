<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Restablecer contraseña - ERP Base</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #17202a;
      background: #eef2f6;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        linear-gradient(135deg, rgba(26, 82, 118, 0.12), rgba(30, 132, 73, 0.08)),
        #eef2f6;
    }

    main {
      width: min(100%, 420px);
      background: #ffffff;
      border: 1px solid #d8dee8;
      border-radius: 8px;
      box-shadow: 0 18px 50px rgba(23, 32, 42, 0.12);
      padding: 28px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
      line-height: 1.2;
      font-weight: 700;
    }

    p {
      margin: 0 0 22px;
      color: #52616f;
      font-size: 14px;
      line-height: 1.5;
    }

    label {
      display: block;
      margin: 16px 0 6px;
      font-size: 14px;
      font-weight: 600;
    }

    input {
      width: 100%;
      min-height: 44px;
      border: 1px solid #c9d2de;
      border-radius: 6px;
      padding: 10px 12px;
      font: inherit;
      outline: none;
    }

    input:focus {
      border-color: #1f6feb;
      box-shadow: 0 0 0 3px rgba(31, 111, 235, 0.14);
    }

    button {
      width: 100%;
      min-height: 44px;
      margin-top: 22px;
      border: 0;
      border-radius: 6px;
      background: #1f6feb;
      color: #ffffff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.68;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 6px;
      font-size: 14px;
      line-height: 1.45;
    }

    .message.visible {
      display: block;
    }

    .message.success {
      color: #0f5132;
      background: #d1e7dd;
      border: 1px solid #badbcc;
    }

    .message.error {
      color: #842029;
      background: #f8d7da;
      border: 1px solid #f5c2c7;
    }
  </style>
</head>
<body>
  <main>
    <h1>Restablecer contraseña</h1>
    <p>Ingresa tu nueva contraseña para completar la recuperación de acceso.</p>

    <form id="reset-form">
      <label for="new-password">Nueva contraseña</label>
      <input id="new-password" name="newPassword" type="password" autocomplete="new-password" minlength="8" maxlength="100" required>

      <label for="confirm-password">Confirmar contraseña</label>
      <input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" maxlength="100" required>

      <button id="submit-button" type="submit">Guardar nueva contraseña</button>
    </form>

    <div id="message" class="message" role="status" aria-live="polite"></div>
  </main>

  <script>
    const form = document.getElementById("reset-form");
    const button = document.getElementById("submit-button");
    const message = document.getElementById("message");
    const token = new URLSearchParams(window.location.search).get("token");

    function showMessage(text, type) {
      message.textContent = text;
      message.className = `message visible ${type}`;
    }

    if (!token) {
      form.hidden = true;
      showMessage("El enlace de recuperación no incluye un token válido.", "error");
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const newPassword = document.getElementById("new-password").value;
      const confirmPassword = document.getElementById("confirm-password").value;

      if (newPassword !== confirmPassword) {
        showMessage("Las contraseñas no coinciden.", "error");
        return;
      }

      button.disabled = true;
      button.textContent = "Guardando...";

      try {
        const response = await fetch(`/api/auth/reset-password?token=${encodeURIComponent(token)}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ newPassword, confirmPassword })
        });

        if (response.status === 204) {
          form.reset();
          form.hidden = true;
          showMessage("Tu contraseña fue actualizada correctamente.", "success");
          return;
        }

        let detail = "No se pudo restablecer la contraseña.";
        try {
          const body = await response.json();
          detail = body.message || body.title || detail;
        } catch {
        }

        showMessage(detail, "error");
      } catch {
        showMessage("No se pudo conectar con el servidor.", "error");
      } finally {
        button.disabled = false;
        button.textContent = "Guardar nueva contraseña";
      }
    });
  </script>
</body>
</html>
